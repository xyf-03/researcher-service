# GitHub Actions CI —— issue #91（skeleton + frontend job）、issue #93（server 质量门）。父票 #74。
# push 触发；frontend / server 双轨并行把关（vitest + vue-tsc / Express vitest + tsc + build），
# 任一红即拦。Django backend-unit（旧 #92/#93 pytest + pylint）随 #341 M9 退役删除。
name: CI

on: push

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 对齐 frontend/package-lock.json 的 LTS（约束 ^20.19.0||^22.12.0||>=24.0.0）
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # Express 控制面（server/，#333 M0+M1）：prisma generate + tsc + vitest + build 全绿才算通过。
  # Codex #342 ⑲ P2：此前 CI 只跑 frontend/Django，server 破坏编译/生成 client/44 认证用例 CI 仍绿。
  # src/generated 被 gitignore（fresh checkout 无此目录），但 typecheck/test 都 import 生成产物 ——
  # 故 typecheck/test 前必须先跑 prisma generate（build 的 prebuild 钩子会自动做，但顺序上 typecheck
  # 在其前，须显式生成一次）。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # 显式 pin 官方基线跑 smoke（派生镜像 ghcr.io/.../openclaw 由 CD 在 CI 通过后构建推送，
      # CI 阶段尚不存在；smoke 测编排逻辑，官方/派生镜像等价）。派生镜像的静态断言
      # 在 test/openclawImage.test.ts（本 job 全量跑）。
      # CI runner 自带 docker daemon → smoke 门控放行真跑（区别于本地无 daemon 时 skip），
      # 故须预拉镜像，否则 create 拉镜像 404 让 smoke 红（镜像缺失是环境问题，非代码问题）。
      OPENCLAW_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1-browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      # 预拉 OpenClaw 公共 ghcr 镜像供 containers-smoke 端到端测试。
      - run: docker pull ${{ env.OPENCLAW_IMAGE }}
      # 派生镜像构建验证（issue #588）：Dockerfile 构建期断言（pdftotext 可用 + 12 骨架文件
      # 齐全）在此实跑——构建失败 CI 即红，派生镜像的首次执行不落在生产（CD 另负责推送）。
      - name: Build derived openclaw image (issue #588)
        # working-directory=server → 上下文经 ../deploy 回仓库根
        run: docker build ../deploy/openclaw-image
      # 端口映射探针（#378 CI 定位）：确认 runner 上容器宿主端口映射可用（docker-proxy）。
      # 容器内须有真实监听服务（busybox httpd）才可信——之前用 sh /dev/tcp 自连是误报。
      - name: Docker port mapping probe
        run: |
          docker run -d --name port-probe -p 19899:80 busybox:latest httpd -f -p 80 -h /tmp || { echo "PROBE RUN FAILED"; exit 1; }
          sleep 3
          if (echo > /dev/tcp/127.0.0.1/19899) 2>/dev/null; then
            echo "PORT MAPPING OK"
            docker rm -f port-probe >/dev/null 2>&1
            exit 0
          else
            echo "PORT MAPPING FAILED (127.0.0.1:19899 unreachable)"
            docker logs port-probe 2>&1 | tail -5
            docker rm -f port-probe >/dev/null 2>&1
            exit 1
          fi
      - run: npm test
      - run: npm run build
